    box-shadow:0 12px 30px rgba(4,36,64,.2);
  }
  .logo-img{display:block;height:28px;width:auto;}
  .logo span{font-size:12px;color:var(--ink-500);padding-left:10px;border-left:1px solid var(--line);margin-left:2px;}
  .top-right{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#41546d;}
  .top-right a{
    padding:7px 13px;border-radius:8px;background:rgba(255,255,255,.82);border:1px solid rgba(120,150,190,.28);
    backdrop-filter:blur(6px);transition:.18s;box-shadow:0 4px 14px rgba(20,50,90,.08);
  }
  .top-right a:hover{background:#fff;color:var(--green-d);border-color:rgba(0,184,158,.42);}

  /* ---------------- 主体：登录卡靠右 ---------------- */
  .stage{
    min-height:100vh;display:flex;align-items:center;justify-content:flex-end;
    padding:96px 6vw 56px 28px;
  }
  .card{
    width:412px;max-width:100%;background:#fff;border-radius:18px;padding:30px 30px 22px;
    box-shadow:0 30px 70px rgba(4,32,60,.3),0 2px 8px rgba(4,32,60,.1);border:1px solid rgba(255,255,255,.6);
  }
  .card-head{display:flex;gap:13px;align-items:center;}
  .shield{
    width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,#00c9a7,#0f9fc4);box-shadow:0 8px 18px rgba(0,184,158,.3);
  }
  .card-head h2{font-size:19px;font-weight:800;letter-spacing:.5px;}
  .card-head p{font-size:12px;color:var(--ink-500);margin-top:3px;letter-spacing:.2px;}

  /* 登录方式切换 */
  .tabs{display:flex;gap:4px;background:#eff4fa;border-radius:9px;padding:4px;margin:20px 0 18px;}
  .tab{
    flex:1;height:34px;border-radius:7px;font-size:13px;color:var(--ink-500);transition:.18s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tab:hover{color:var(--ink-700);}
  .tab.on{background:#fff;color:var(--green-d);font-weight:700;box-shadow:0 2px 8px rgba(18,45,110,.1);}
  .tab svg{width:15px;height:15px;}

  .pane{display:none;}
  .pane.on{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  .field{position:relative;margin-bottom:13px;}
  .field input{
    width:100%;height:44px;border:1px solid #e3e8f0;border-radius:7px;padding:0 42px 0 13px;
    font-size:13.5px;color:var(--ink-900);outline:none;transition:.2s;background:#fff;
  }
  .field input::placeholder{color:#b6c1d2;}
  .field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,184,158,.13);}
  .field.err input{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,69,60,.1);}
  .field .tip{
    position:absolute;left:2px;bottom:-19px;font-size:11.5px;color:var(--red);display:none;
  }
  .field.err .tip{display:block;}
  .field.err{margin-bottom:26px;animation:shake .3s;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;
    display:grid;place-items:center;color:#b6c1d2;border-radius:6px;}
  .eye:hover{color:var(--ink-500);background:#f4f8fd;}
  .eye svg{width:17px;height:17px;}

  .sms-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);height:30px;padding:0 12px;
    font-size:12.5px;color:var(--green-d);border-left:1px solid #e3e8f0;font-weight:600;
  }
  .sms-btn:hover{color:var(--green);}
  .sms-btn:disabled{color:var(--ink-300);cursor:not-allowed;font-weight:400;}

  .row-between{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 16px;font-size:12.5px;color:var(--ink-500);}
  .row-between label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .row-between input[type=checkbox]{accent-color:var(--green);width:13px;height:13px;}
  .row-between a:hover{color:var(--green-d);}

  .btn-login{
    width:100%;height:46px;border-radius:7px;font-size:15.5px;font-weight:700;letter-spacing:3px;color:#fff;
    background:linear-gradient(90deg,#00c9a7,#00b89e);box-shadow:0 10px 22px rgba(0,184,158,.32);
    transition:.22s;display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .btn-login:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn-login:active{transform:none;}
  .btn-login[disabled]{opacity:.82;cursor:default;transform:none;filter:none;box-shadow:none;}
  .spinner{
    width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
    animation:spin .7s linear infinite;display:none;
  }
  .btn-login.loading .spinner{display:block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .bind-note{
    margin-top:14px;padding:10px 12px;border-radius:8px;background:#f2fbf8;border:1px dashed #a9e6d8;
    font-size:11.5px;color:#357a6b;line-height:1.65;display:flex;gap:8px;
  }
  .bind-note svg{flex:none;width:14px;height:14px;margin-top:1px;}
  .bind-note b{color:#0a7d68;}

  .card-foot{
    margin-top:16px;padding-top:14px;border-top:1px solid #f0f4fa;display:flex;align-items:center;
    justify-content:space-between;font-size:12px;color:var(--ink-500);
  }
  .card-foot a:hover{color:var(--green-d);}

  /* ---------------- 演示条 ---------------- */
  .demo{
    position:fixed;left:16px;bottom:16px;z-index:120;display:flex;align-items:center;gap:6px;
    background:rgba(16,26,51,.88);backdrop-filter:blur(10px);padding:6px 8px;border-radius:11px;
    box-shadow:0 10px 28px rgba(6,20,60,.28);
  }
  .demo .tagx{font-size:10px;color:rgba(255,255,255,.45);padding:0 5px;letter-spacing:.5px;}
  .demo button{
    height:26px;padding:0 10px;border-radius:6px;font-size:11px;color:rgba(255,255,255,.82);
    background:rgba(255,255,255,.1);transition:.18s;
  }
  .demo button:hover{background:rgba(255,255,255,.18);}
  .demo button.on{background:#00b89e;color:#fff;font-weight:600;}

  /* toast */
  .toast{
    position:fixed;left:50%;top:88px;transform:translate(-50%,-14px);z-index:130;opacity:0;pointer-events:none;
    background:rgba(16,26,51,.92);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:8px;transition:.24s;
    box-shadow:0 10px 30px rgba(6,20,60,.3);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------------- 响应式 ---------------- */
  @media(max-width:1080px){
    .stage{justify-content:center;padding:92px 24px 52px;}
    .card{width:440px;}
  }
  @media(max-width:640px){
    .topbar{padding:14px 16px;}
    .logo span,.top-right a:first-child{display:none;}
    .stage{padding:80px 16px 40px;align-items:flex-start;}
    .card{padding:24px 20px 18px;border-radius:14px;}
  }
  @media(max-height:700px){
    .stage{padding:84px 24px 36px;}
    .card{padding:24px 26px 18px;}
    .tabs{margin:16px 0 14px;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>

<main class="stage">
  <div class="card">
      <div class="card-head">
        <span class="shield">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.6 20 5.6v6.2c0 5.3-3.4 8.7-8 10.2-4.6-1.5-8-4.9-8-10.2V5.6l8-3Z"/>
            <path d="M8.9 11.9 11.3 14.3 15.6 9.6"/>
          </svg>
        </span>
        <div>
          <h2>可信登录</h2>
          <p>一表通统一认证 · 请选择登录方式</p>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab on" data-pane="pwd">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.4" width="16" height="10" rx="2.4"/><path d="M8 10.4V7.6a4 4 0 0 1 8 0v2.8"/></svg>
          账号密码登录
        </button>
        <button class="tab" data-pane="sms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.6" y="2.6" width="10.8" height="18.8" rx="2.6"/><path d="M10.6 18.4h2.8"/></svg>
          短信登录
        </button>
      </div>

      <!-- 账号密码 -->
      <form class="pane on" id="panePwd" autocomplete="off">
        <div class="field" id="fAcc">
          <input id="acc" type="text" placeholder="身份证号 / 手机号 / 统一账号" autocomplete="username">
          <span class="tip">请输入可信平台账号</span>
        </div>
        <div class="field" id="fPwd">
          <input id="pwd" type="password" placeholder="请输入密码" autocomplete="current-password">
          <button class="eye" type="button" id="eyePwd" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 12S6 5.9 12 5.9 21.4 12 21.4 12 18 18.1 12 18.1 2.6 12 2.6 12Z"/><circle cx="12" cy="12" r="3.1"/></svg>
          </button>
          <span class="tip">请输入密码</span>
        </div>
        <div class="row-between">
          <label><input type="checkbox" id="remember" checked>记住账号</label>
          <a href="javascript:toast('密码找回：请前往可信平台或联系管理员')">忘记密码？</a>
        </div>
        <button class="btn-login" type="submit" id="btnPwd"><span class="spinner"></span><span class="txt">登 录</span></button>
      </form>

      <!-- 短信 -->
      <form class="pane" id="paneSms" autocomplete="off">
        <div class="field" id="fPhone">
          <input id="phone" type="tel" maxlength="11" placeholder="请输入可信平台绑定手机号">
          <span class="tip">请输入正确的 11 位手机号</span>
        </div>
        <div class="field" id="fCode">
          <input id="code" type="text" maxlength="6" placeholder="请输入 6 位验证码">
          <button class="sms-btn" type="button" id="smsBtn">获取验证码</button>
          <span class="tip">请输入验证码</span>
        </div>
        <div class="row-between" style="margin-top:2px">
          <span style="font-size:11.5px;color:var(--ink-300)">验证码 5 分钟内有效</span>
          <a href="javascript:toast('收不到验证码？请检查手机号是否为可信平台预留号码')">收不到验证码？</a>
        </div>
        <button class="btn-login" type="submit" id="btnSms"><span class="spinner"></span><span class="txt">登 录</span></button>
      </form>

      <div class="bind-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a9c86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 8.2v.1M11.2 11.4h1v5.2"/></svg>
        <span>首次使用可信登录，系统将自动完成<b>桂教通 ↔ 可信平台</b>的人员绑定，无需重复注册。</span>
      </div>

      <div class="card-foot">
        <a href="index.html">← 使用桂教通账号密码登录</a>
        <a href="javascript:toast('遇到问题？请联系学校管理员或平台客服')">遇到问题？</a>
      </div>
  </div>
</main>

<!-- 演示条 -->
<div class="demo">
  <span class="tagx">演示</span>
  <button id="mFirst" class="on">首次登录 · 已有账号</button>
  <button id="mNew">首次登录 · 无账号</button>
  <button id="mBound">已绑定 · 静默登录</button>
</div>

<div class="toast" id="toastEl"></div>

<script>
  let toastTimer = null;
  function toast(msg){
    const t = document.getElementById('toastEl');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
  }

  /* ---------- 登录方式切换 ---------- */
  document.querySelectorAll('#tabs .tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.toggle('on', x===tab));
      document.getElementById('panePwd').classList.toggle('on', tab.dataset.pane==='pwd');
      document.getElementById('paneSms').classList.toggle('on', tab.dataset.pane==='sms');
      clearErrs();
    });
  });

  function clearErrs(){
    document.querySelectorAll('.field.err').forEach(f=>f.classList.remove('err'));
  }
  function markErr(id){
    const f = document.getElementById(id);
    f.classList.remove('err'); void f.offsetWidth; f.classList.add('err');
  }
  const isPhone = v => /^1\d{10}$/.test(v);

  /* ---------- 密码显隐 ---------- */
  document.getElementById('eyePwd').addEventListener('click', ()=>{
    const i = document.getElementById('pwd');
    const on = i.type === 'password';
    i.type = on ? 'text' : 'password';
    document.getElementById('eyePwd').style.color = on ? 'var(--green-d)' : '';
  });

  /* ---------- 验证码倒计时 ---------- */
  let codeTimer = null;
  document.getElementById('smsBtn').addEventListener('click', ()=>{
    const phone = document.getElementById('phone').value.trim();
    if(!isPhone(phone)){ markErr('fPhone'); return; }
    clearErrs();
    toast('验证码已发送至 ' + phone.slice(0,3) + '****' + phone.slice(7));
    const btn = document.getElementById('smsBtn');
    let left = 60;
    btn.disabled = true; btn.textContent = left + 's 后重发';
    clearInterval(codeTimer);
    codeTimer = setInterval(()=>{
      left--;
      if(left <= 0){ clearInterval(codeTimer); btn.disabled = false; btn.textContent = '获取验证码'; return; }
      btn.textContent = left + 's 后重发';
    }, 1000);
  });

  /* ---------- 登录成功 → 跳转绑定过渡页 ---------- */
  const BINDING = 'binding.html';
  let demoMode = 'first';         // 演练：first 已有账号 / newacc 无账号 / bound 已绑定

  function setLoading(form, on, text){
    const btn = form.querySelector('.btn-login');
    btn.classList.toggle('loading', on);
    btn.disabled = on;
    btn.querySelector('.txt').textContent = on ? text : '登 录';
  }

  function login(acc){
    // 后端登录成功：交由 binding.html 完成可信身份 ↔ 桂教通账号的绑定与转场
    const q = new URLSearchParams({ mode: demoMode, acc: acc || '' });
    location.href = BINDING + '?' + q.toString();
  }

  /* 密码登录 */
  document.getElementById('panePwd').addEventListener('submit', e=>{
    e.preventDefault();
    clearErrs();
    let bad = false;
    if(!document.getElementById('acc').value.trim()){ markErr('fAcc'); bad = true; }
    if(!document.getElementById('pwd').value.trim()){ markErr('fPwd'); bad = true; }
    if(bad) return;
    const form = e.currentTarget;
    setLoading(form, true, '正在验证可信身份…');
    setTimeout(()=>{ setLoading(form, false); login(document.getElementById('acc').value.trim()); }, 1100);
  });

  /* 短信登录 */
  document.getElementById('paneSms').addEventListener('submit', e=>{
    e.preventDefault();
    clearErrs();
    let bad = false;
    if(!isPhone(document.getElementById('phone').value.trim())){ markErr('fPhone'); bad = true; }
    if(document.getElementById('code').value.trim().length < 4){ markErr('fCode'); bad = true; }
    if(bad) return;
    const form = e.currentTarget;
    setLoading(form, true, '正在验证短信验证码…');
    setTimeout(()=>{ setLoading(form, false); login(document.getElementById('phone').value.trim()); }, 1000);
  });

  /* 演示模式 */
  const bFirst = document.getElementById('mFirst');
  const bNew   = document.getElementById('mNew');
  const bBound = document.getElementById('mBound');
  const DEMO_BTNS = { first: bFirst, newacc: bNew, bound: bBound };
  function pickDemo(mode, msg){
    demoMode = mode;
    Object.keys(DEMO_BTNS).forEach(k => DEMO_BTNS[k].classList.toggle('on', k === mode));
    toast(msg);
  }
  bFirst.addEventListener('click', ()=>pickDemo('first',  '演示模式：首次登录 · 已有桂教通账号（需选择绑定机构）'));
  bNew  .addEventListener('click', ()=>pickDemo('newacc', '演示模式：首次登录 · 无桂教通账号（按社会群体自动建档）'));
  bBound.addEventListener('click', ()=>pickDemo('bound',  '演示模式：已绑定账号（静默登录，不再选择机构）'));
</script>
</body>
