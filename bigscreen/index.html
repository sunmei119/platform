<!DOCTYPE html>
<html lang="zh-CN">
<!--
  部署说明（无需构建，无后端）：
  1. 整个 bigscreen/ 目录拷至展示终端（ECharts 已本地化在 lib/，支持离线/内网）。
  2. 任一起一个静态服务即可，例如：python -m http.server 8080（在 bigscreen 目录下执行）。
  3. 浏览器访问 http://127.0.0.1:8080/ ，按 F11 或点击右上角全屏按钮进入全屏；
     全屏态出现左右切换按钮，可切换多张大屏；右上角「缩小」按钮返回普通态。
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>智慧教育 · 应用数据大屏</title>
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <!-- ===== 头部 ===== -->
    <header class="hd">
      <div class="hd-left">
        <!-- 左上角：屏切换器，兼容「下拉菜单」与「单 Tab」两种形态 -->
        <div id="screenSwitch" class="switch">
          <button id="switchBtn" class="switch-btn" type="button">
            <span class="switch-dot"></span>
            <span id="switchLabel">应用数据总览</span>
            <svg id="switchCaret" class="switch-caret" width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M6 9l6 6 6-6" stroke="#6b7b90" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <ul id="switchMenu" class="switch-menu"></ul>
        </div>
      </div>

      <div class="hd-center">
        <h1 class="hd-title">智慧教育 · 应用数据大屏</h1>
        <p class="hd-sub">DATA CENTER · APPLICATION SERVICE OVERVIEW</p>
      </div>

      <div class="hd-right">
        <div class="hd-clock">
          <span id="calDate">--</span>
          <span id="calTime">--:--:--</span>
        </div>
        <button id="fsBtn" class="icon-btn" type="button" title="全屏展开">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"
              stroke="#3d5a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== 顶部两个入口卡片 ===== -->
    <section class="top-cards">
      <button class="top-card tpl-space" type="button" data-action="tpl">
        <span class="tc-ico">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3.4" y="4.2" width="17.2" height="15.6" rx="2.6" stroke="#fff" stroke-width="1.9"/>
            <path d="M7.4 15.6V11M11.9 15.6V7.9M16.4 15.6v-3.2" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tc-body">
          <span class="tc-title">报表样例空间</span>
          <span class="tc-desc">浏览官方与热门报表模板，一键复用分析思路与图表配置，快速上手。</span>
        </span>
        <svg class="tc-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="top-card tpl-create" type="button" data-action="create">
        <span class="tc-ico">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="3.4" y="4.2" width="17.2" height="15.6" rx="2.6" stroke="#fff" stroke-width="1.9"/>
            <path d="M12 8.4v7.2M8.4 12h7.2" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="tc-body">
          <span class="tc-title">新建我的报表</span>
          <span class="tc-desc">从统计范围、指标到图表类型自由配置，快速生成专属数据报表。</span>
        </span>
        <svg class="tc-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </section>

    <!-- ===== KPI 卡片区（可多行） ===== -->
    <div class="kpi-area" id="kpiArea"></div>

    <!-- ===== 主图表区（每屏两栏） ===== -->
    <main class="main-row" id="mainRow"></main>

    <!-- ===== 全屏态：左右切换 + 缩小 ===== -->
    <button id="navPrev" class="nav-btn nav-left" type="button" title="上一张大屏">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#3d5a80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="navNext" class="nav-btn nav-right" type="button" title="下一张大屏">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="#3d5a80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="fsExit" class="fs-exit" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path d="M9 4v3.5A1.5 1.5 0 0 1 7.5 9H4M20 9h-3.5A1.5 1.5 0 0 1 15 7.5V4M15 20v-3.5a1.5 1.5 0 0 1 1.5-1.5H20M4 15h3.5A1.5 1.5 0 0 1 9 16.5V20"
          stroke="#3d5a80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>缩小</span>
    </button>

    <!-- ===== 非全屏态：右侧悬浮入口（圆形图标 + 常驻文字） ===== -->
    <div id="dock" class="dock">
      <!-- 创建我的大屏：显示器 + 加号角标 -->
      <button class="dock-btn b-create" type="button" data-action="create" aria-label="创建我的大屏">
        <span class="dock-ico">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="2.8" y="4.4" width="15.2" height="10.8" rx="2" stroke="#4080ff" stroke-width="1.9"/>
            <path d="M8.6 19.7h6.8M12 15.2v4.5" stroke="#4080ff" stroke-width="1.9" stroke-linecap="round"/>
            <circle cx="17.3" cy="6.5" r="4.8" fill="#4080ff" stroke="#fff" stroke-width="1.6"/>
            <path d="M17.3 4.4v4.2M15.2 6.5h4.2" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="dock-label">创建我的大屏</span>
      </button>
      <!-- AI问数：对话气泡 + AI 灵光辉点 -->
      <button class="dock-btn b-ai" type="button" data-action="ai" aria-label="AI问数">
        <span class="dock-ico">
          <svg viewBox="0 0 24 24" fill="none">
            <ellipse cx="12" cy="10.6" rx="8.6" ry="6.6" stroke="#7c6cf5" stroke-width="1.9"/>
            <path d="M9.4 16.1L8 20.6l4.6-4.1" stroke="#7c6cf5" stroke-width="1.9" stroke-linejoin="round" fill="none"/>
            <path d="M12 7.2l1.15 2.6 2.6 1.15-2.6 1.15L12 14.7l-1.15-2.6-2.6-1.15 2.6-1.15L12 7.2z" fill="#7c6cf5"/>
          </svg>
        </span>
        <span class="dock-label">AI问数</span>
      </button>
      <!-- 模板空间：叠放的模板卡片 -->
      <button class="dock-btn b-tpl" type="button" data-action="tpl" aria-label="模板空间">
        <span class="dock-ico">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 16.6V6a1.3 1.3 0 0 1 1.3-1.3H17" stroke="#00b390" stroke-width="1.9" stroke-linecap="round"/>
            <rect x="7.8" y="7.8" width="12.2" height="12.2" rx="2" fill="#fff" stroke="#00b390" stroke-width="1.9"/>
            <path d="M11 12h5.8M11 15.4h3.8" stroke="#00b390" stroke-width="1.9" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="dock-label">模板空间</span>
      </button>
    </div>

    <div id="toast" class="toast"></div>
  </div>
</div>

<script src="lib/echarts.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
